function render(html){const a=document.activeElement,id=a&&a.id,ok=a&&(a.tagName=="INPUT"||a.tagName=="TEXTAREA")&&id&&!["file","checkbox"].includes(a.type),v=ok?a.value:null,p=ok?a.selectionStart:0;root.innerHTML=html;if(ok){const e=document.getElementById(id);if(e){e.value=v;e.focus({preventScroll:true});try{e.setSelectionRange(p,p)}catch(x){}if(id=="q")e.dispatchEvent(new Event("input",{bubbles:true}))}}}
const popupHTML=P=>{const sp=["✨","⭐","🎉","📚","🎓","✨"];return `<div class="ppm"><div class="ppb" data-a="ppx"></div><div class="ppf">${Array.from({length:14},(_,i)=>`<span style="left:${(i*37+8)%96}%;animation-delay:${(i*.7)%5}s;animation-duration:${5+(i%4)*1.5}s;font-size:${14+(i%3)*6}px">${sp[i%6]}</span>`).join("")}</div><div class="ppw"><button class="ppx" data-a="ppx" aria-label="Close">✕</button><div class="ppc"><img class="pplg" src="logo.png" alt=""><div class="ppbd">✨ Topper's Hub Education</div>${P.img?`<div class="ppimg"><img src="${P.img}" alt=""><i></i></div>`:""}${P.title?`<h3>${esc(P.title)}</h3>`:""}${P.t?`<p>${esc(P.t)}</p>`:""}${P.link?`<a class="btn lnk" href="${esc(P.link)}" target="_blank" rel="noopener">${esc(P.btn||"Open")}</a>`:""}<button class="ghost ppok" data-a="ppx">Close</button></div></div></div>`};
let tx=null;document.addEventListener("touchstart",e=>{tx=e.target.closest?.(".lbc img")?e.touches[0].clientX:null},{passive:true});document.addEventListener("touchend",e=>{if(tx==null)return;const dx=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(dx)>60)acts.swp?.(dx)});
document.addEventListener("keydown",e=>acts.key?.(e.key));
const shell=(role,body)=>{root.innerHTML=`<header><img class="lg" src="logo.png" alt=""><b>Topper's Hub</b><span class="tag">${role}</span><button class="ghost" data-a="out">Logout</button></header><main>${body}</main>`};
const toQR=(f,mx=500,q=.85)=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,mx/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*k;c.height=i.height*k;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(i,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",q))};i.onerror=()=>no(new Error("cannot read this image"));i.src=r.result};r.onerror=()=>no(new Error("cannot read file"));r.readAsDataURL(f)});
const tmo=(p,ms)=>Promise.race([p,new Promise((_,j)=>setTimeout(()=>j(new Error("timeout")),ms))]);
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(b&&acts[b.dataset.a])acts[b.dataset.a](b.dataset)});
root.addEventListener("change",async e=>{if(e.target.id=="fm"){FM=e.target.value||null;acts.redraw?.();return}if(e.target.id=="pf"&&e.target.files[0]){try{await setDoc(doc(db,"config","popup"),{img:await toQR(e.target.files[0],900),v:Date.now()},{merge:true});toast("Popup photo saved")}catch(x){toast("Could not save photo")}return}if(e.target.id!="qf"||!e.target.files[0])return;try{await setDoc(doc(db,"config","pay"),{qr:await toQR(e.target.files[0])},{merge:true});toast("QR code saved")}catch(x){toast("Could not save QR")}});
root.addEventListener("input",e=>{if(e.target.id!="q")return;const v=e.target.value.toLowerCase();root.querySelectorAll(".sc").forEach(c=>c.style.display=c.textContent.toLowerCase().includes(v)?"":"none")});
acts.out=()=>signOut(auth);
const inst=document.getElementById("inst");let ip=null;
const standalone=matchMedia("(display-mode: standalone)").matches||navigator.standalone;
const showInst=()=>{try{if(standalone||sessionStorage.getItem("noinst"))return}catch(e){}inst.innerHTML=`<img src="logo.png" alt=""><span style="flex:1">Use the Topper's Hub app</span><button data-a="inst">Use app</button><button class="x" data-a="noinst">✕</button>`;inst.classList.add("on")};
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();ip=e;showInst()});
window.addEventListener("appinstalled",()=>inst.classList.remove("on"));
if(/iphone|ipad|ipod/i.test(navigator.userAgent))setTimeout(showInst,1200);
acts.inst=async()=>{if(ip){ip.prompt();await ip.userChoice;ip=null;inst.classList.remove("on")}else toast("Tap the Share button, then Add to Home Screen")};
acts.noinst=()=>{try{sessionStorage.setItem("noinst","1")}catch(e){}inst.classList.remove("on")};
if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));

acts.g=async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){toast("Sign-in failed: "+(e.code||e.message))}};
onAuthStateChanged(auth,u=>{
  unsubs.forEach(f=>f());unsubs=[];

    if(tab=="f"){const fm=FM||today().slice(0,7);let mp=0,mr=0;

    if(tab=="c")h=`<div class="card pop"><h3>Support contact</h3><small>Parents can call or WhatsApp this number. Include the country code, e.g. 919876543210.</small><input id="cp" placeholder="Phone number" value="${esc(C.phone)}"><h3>YouTube channel</h3><small>Channel ID (starts with UC). All your uploads appear in the parents' video gallery.</small><input id="cy" placeholder="UCxxxxxxxxxxxxxxxxxxxxxx" value="${esc(C.yt||YT)}"><label class="chk"><input id="cl" type="checkbox" ${C.live?"checked":""} style="width:auto;margin:0 10px 0 0">Live class is on now</label><button class="btn" data-a="savec">Save settings</button></div><div class="card pop"><h3>Payment QR code</h3><p><small>Upload your payment QR. Parents see it when they tap Pay.</small></p>${C.qr?`<img class="qr" src="${C.qr}" alt="QR">`:`<p><small>No QR uploaded yet.</small></p>`}<br><input id="qf" type="file" accept="image/*"></div>`;
    render(`<header><button class="ghost" data-a="menu">☰</button><img class="lg" src="logo.png" alt=""><b>${M.find(x=>x[0]==tab)[1]}</b><span class="tag">Admin</span></header><div class="ov ${open?"on":""}" data-a="menu"></div><aside class="side ${open?"on":""}">${M.map(([k,l,i])=>`<button class="${tab==k?"on":""}" data-a="go" data-k="${k}">${i} ${l}${k=="p"&&claims.length?` (${claims.length})`:k=="ap"&&AP.length?` (${AP.length})`:""}</button>`).join("")}<button data-a="out">🚪 Logout</button></aside><main>${h}</main>${pv?popupHTML(PP):""}`);
  };
  unsubs.push(onSnapshot(collection(db,"students"),s=>{S=s.docs.map(d=>({id:d.id,...d.data()}));draw()},e=>toast("Could not load data: "+e.code)));
  unsubs.push(onSnapshot(query(collection(db,"notices"),orderBy("ts","desc")),s=>{N=s.docs.map(d=>({id:d.id,...d.data()}));draw()}));
  unsubs.push(onSnapshot(collection(db,"payments"),s=>{P=s.docs.map(d=>({id:d.id,...d.data()}));draw()}));

  unsubs.push(onSnapshot(collection(db,"videos"),q=>{V=q.docs.map(d=>({id:d.id,...d.data()}));draw()}));
  unsubs.push(onSnapshot(collection(db,"homework"),q=>{H=q.docs.map(d=>({id:d.id,...d.data()}));draw()}));
  unsubs.push(onSnapshot(doc(db,"config","pay"),d=>{C=d.data()||{};draw()}));
  unsubs.push(onSnapshot(doc(db,"config","popup"),d=>{PP=d.data()||{};draw()}));
  unsubs.push(onSnapshot(collection(db,"albums"),q=>{AL=q.docs.map(d=>({id:d.id,...d.data()}));draw()},e=>toast("Albums: "+e.code)));
  unsubs.push(onSnapshot(collection(db,"album_items"),q=>{IT=q.docs.map(d=>({id:d.id,...d.data()}));draw()},e=>toast("Album items: "+e.code)));
  acts.redraw=draw;
  acts.menu=()=>{open=!open;draw(true)};
  acts.go=d=>{tab=d.k;open=false;draw(true)};
  acts.add=async()=>{const name=val("fn"),cls=val("fc"),pe=val("fe").toLowerCase();
    if(!name||!/^\S+@\S+\.\S+$/.test(pe))return toast("Enter the name and a valid Gmail");
    await addDoc(collection(db,"students"),{name,cls,parentEmail:pe,pm:{},adm:val("fd")||today(),address:"",att:{},tests:[],ts:serverTimestamp()});toast("Student saved");tab="s";draw()};
  acts.recv=d=>{const v=val("rc_"+d.id);if(v===""||isNaN(v)||+v<0)return toast("Enter a valid amount");updateDoc(R(d.id),{["pm."+d.m]:+v});toast("Saved")};
  acts.delap=d=>confirm("Delete this application?")&&deleteDoc(doc(db,"applications",d.id));
  acts.admit=async d=>{const x=AP.find(a=>a.id==d.id);if(!x)return;await addDoc(collection(db,"students"),{name:x.name,cls:x.cls,parentEmail:x.email,pm:{},adm:today(),address:"",att:{},tests:[],ts:serverTimestamp()});await deleteDoc(doc(db,"applications",d.id));toast("Student added");tab="s";draw()};
  acts.savec=async()=>{await setDoc(doc(db,"config","pay"),{phone:val("cp").replace(/\D/g,""),yt:val("cy")||YT,live:!!document.getElementById("cl")?.checked},{merge:true});toast("Settings saved")};
  acts.addv=async()=>{const m=val("vl").match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/);if(!m)return toast("Paste a valid YouTube video link");await addDoc(collection(db,"videos"),{vid:m[1],t:val("vt")||"Video",ts:serverTimestamp()});toast("Video added")};
  const sf=o=>setDoc(doc(db,"config","fees"),o,{merge:true});
  acts.savereg=async()=>{const v=val("rg");if(v===""||isNaN(v))return toast("Enter a valid amount");await sf({reg:+v});toast("Registration fee saved")};
  acts.addcls=async()=>{const c=val("fcn"),f=val("fcf");if(!c||f===""||isNaN(f))return toast("Enter the class and its fee");await sf({list:[...(F.list||[]),{c,f:+f}]});toast("Class added")};
  acts.savecls=async d=>{const v=val("cf_"+d.i);if(v===""||isNaN(v))return toast("Enter a valid amount");const L=[...(F.list||[])];L[+d.i]={...L[+d.i],f:+v};await sf({list:L});toast("Fee updated")};
  acts.delcls=async d=>{if(!confirm("Remove this class fee?"))return;await sf({list:(F.list||[]).filter((_,i)=>i!=+d.i)});toast("Removed")};
  acts.delv=d=>confirm("Delete this video?")&&deleteDoc(doc(db,"videos",d.id));
  acts.ppprev=()=>{pv=true;draw()};
  acts.ppx=()=>{pv=false;draw()};
  acts.addal=async()=>{const n=val("aln");if(!n)return toast("Enter the album name");const r=await addDoc(collection(db,"albums"),{name:n,pinned:false,ts:serverTimestamp()});aa=r.id;toast("Album created");draw()};
  acts.opal=d=>{aa=d.id;draw()};
  acts.pinal=async d=>{const a=AL.find(x=>x.id==d.id);if(!a)return;if(!a.pinned&&AL.filter(x=>x.pinned).length>=4)return toast("Only 4 albums can be pinned");await updateDoc(doc(db,"albums",d.id),{pinned:!a.pinned});toast(a.pinned?"Unpinned":"Pinned on top")};
  const rmItem=async x=>{try{await deleteDoc(doc(db,"album_full",x.id))}catch(e){}await deleteDoc(doc(db,"album_items",x.id))};
  acts.delit=async d=>{if(!confirm("Delete this item?"))return;const x=IT.find(i=>i.id==d.id);if(x){await rmItem(x);toast("Deleted")}};
  acts.delal=async d=>{if(!confirm("Delete this album and everything inside it?"))return;for(const x of IT.filter(i=>i.aid==d.id))await rmItem(x);await deleteDoc(doc(db,"albums",d.id));if(aa==d.id)aa="main";toast("Album deleted")};
  const setP=()=>{const b=document.getElementById("alp"),l=document.getElementById("als");if(b)b.style.width=aW+"%";if(l)l.textContent=aT};
  acts.upal=async()=>{if(upl)return toast("Upload already running");const fs=[...(document.getElementById("alf")?.files||[])];if(!fs.length)return toast("Choose photos first");upl=true;const tgt=aa,jobs=[];let ok=0,fail=0,why="";
    for(let i=0;i<fs.length;i++){const f=fs[i];aT=`Preparing ${i+1} of ${fs.length}…`;aW=Math.round(i*50/fs.length);setP();
      try{if(!(f.type.startsWith("image/")||/\.(jpe?g|png|webp|gif|heic)$/i.test(f.name)))throw new Error("only photos are allowed");let img=await tmo(toQR(f,1280,.8),60000);if(img.length>950000)img=await tmo(toQR(f,900,.6),60000);jobs.push({img,th:await tmo(toQR(f,360,.7),60000)})}catch(e){fail++;why=e.message||e.code||String(e)}}
    for(let i=0;i<jobs.length;i++){const j=jobs[i];aT=`Uploading ${i+1} of ${jobs.length}…`;aW=50+Math.round(i*50/jobs.length);setP();
      try{const id=doc(collection(db,"album_items")).id;await tmo(setDoc(doc(db,"album_full",id),{img:j.img,aid:tgt}),45000);await tmo(setDoc(doc(db,"album_items",id),{aid:tgt,k:"p",th:j.th,ts:serverTimestamp()}),45000);ok++}catch(e){fail++;why=e.code||e.message||String(e)}}
    upl=false;aT="";aW=0;toast(`${ok} uploaded${fail?`, ${fail} failed (${why})`:""}`);draw(true)};
  acts.savepp=async()=>{await setDoc(doc(db,"config","popup"),{title:val("ppt"),t:document.getElementById("ppd")?.value.trim()||"",btn:val("ppbt"),link:(l=>l&&!/^https?:\/\//i.test(l)?"https://"+l:l)(val("ppl")),on:!!document.getElementById("ppo")?.checked,v:Date.now()},{merge:true});toast("Popup saved")};
  acts.ppnoimg=async()=>{await setDoc(doc(db,"config","popup"),{img:"",v:Date.now()},{merge:true});toast("Photo removed")};
  acts.addh=async()=>{const t=val("ht");if(!t)return toast("Write the homework first");await addDoc(collection(db,"homework"),{cls:val("hc")||"All",t,ts:serverTimestamp()});toast("Homework posted")};
  acts.delh=d=>deleteDoc(doc(db,"homework",d.id));
  acts.att=d=>updateDoc(R(d.id),{["att."+today()]:d.v});
  acts.test=d=>{const p=(prompt("Test name, marks, out of (example: Unit1,42,50)")||"").split(",");
    if(p.length<3||isNaN(p[1])||isNaN(p[2]))return;updateDoc(R(d.id),{tests:arrayUnion({n:p[0].trim(),m:+p[1],x:+p[2],d:today()})});toast("Test added")};
  acts.del=d=>confirm("Delete this student and all their data?")&&deleteDoc(R(d.id));
  acts.ok=d=>{const p=P.find(x=>x.id==d.id),s=find(p.sid);if(!s)return toast("Student not found");const rows=cal(s).rows,up={};let left=p.amt;
    for(const r of rows){if(left<=0)break;if(r.pend>0){const a=Math.min(left,r.pend);up["pm."+r.m]=r.paid+a;left-=a}}
    if(left>0&&rows.length){const l=rows[rows.length-1];up["pm."+l.m]=(up["pm."+l.m]??l.paid)+left}
    if(Object.keys(up).length)updateDoc(R(p.sid),up);updateDoc(doc(db,"payments",d.id),{status:"approved"});toast("Payment approved")};
  acts.no=d=>updateDoc(doc(db,"payments",d.id),{status:"rejected"});
  acts.post=async()=>{const t=val("nt");if(!t)return toast("Write a notice first");await addDoc(collection(db,"notices"),{t,ts:serverTimestamp()});toast("Notice sent")};
  acts.deln=d=>deleteDoc(doc(db,"notices",d.id));
}

function parentView(u,em){
  let S=[],N=[],P=[],V=[],H=[],A=[],C={},PP={},AL=[],IT=[],openA=null,lb=null,FULL={},EA={},pay=null,ld=false,play=null,pg="h",ppSeen=false;
  const aitems=()=>IT.filter(x=>x.aid==openA).sort(byTs);
  const draw=()=>{
    let h="";
    if(pg=="h"){
      const first=esc((u.displayName||"").split(" ")[0]||"Parent");
      h=`<div class="hero pop"><small>Welcome 👋</small><h2>${first}</h2><small>Topper's Hub Education · attendance, fees and tests of your child</small></div>`+(C.live?`<div class="note pop" data-a="pg" data-k="v" style="cursor:pointer">🔴 Live class is on now. Tap to watch.</div>`:"")+`<div class="qa">${[["v","🎬","Videos"],["g","🖼","Album"],["i","🏷","Fee list"],["s","💬","Help"]].map(([k,i,l])=>`<button class="pop" data-a="pg" data-k="${k}"><i>${i}</i>${l}</button>`).join("")}</div>`;
      h+=S.length?`<div class="sec"><span>👩‍🎓</span><h3>My child</h3></div>`+S.map(s=>{const t=(s.tests||[]).slice().reverse(),l=t[0],wait=P.some(p=>p.sid==s.id&&p.status=="pending"),c=cal(s),cur=c.rows[c.rows.length-1]||{due:0,paid:0,pend:0},ed=EA[s.id]||!s.address;
        return `<div class="card pop"><div class="who"><div class="av">${esc((s.name||"?").trim().charAt(0).toUpperCase())}</div><div><b style="font-size:18px">${esc(s.name)}</b><br><small>Class: ${esc(s.cls)}</small></div></div>
        <div class="sub"><div class="st">✅ Attendance</div><div class="top"><small>Present in ${pct(s.att)}% of the classes so far</small>${ring(pct(s.att))}</div></div>
        <div class="sub"><div class="st">📝 Test results</div>${l?`<div class="top"><small>${esc(l.n)}</small><b>${l.m}/${l.x}</b></div><div class="bar"><span style="width:${Math.round(l.m*100/l.x)}%"></span></div>${t.slice(1,4).map(x=>`<div class="top" style="margin-top:4px"><small>${esc(x.n)}</small><small>${x.m}/${x.x}</small></div>`).join("")}`:`<small>No test reports yet.</small>`}</div>
        <div class="sub"><div class="st">💰 Fees</div><div class="two" style="margin-top:0"><div class="box"><small>This month pending</small><b style="color:var(--bad)">${money(cur.pend)}</b><small>Fee ${money(cur.due)} · received ${money(cur.paid)}</small></div><div class="box"><small>Total pending</small><b style="color:var(--bad)">${money(c.pend)}</b><small>${c.np} month${c.np==1?"":"s"} pending · paid so far ${money(c.paid)}</small></div></div>
        <div style="margin-top:10px">${c.pend>0?(wait?`<small>Payment sent. Waiting for confirmation.</small>`:`<button class="btn" data-a="pay" data-id="${s.id}">Pay ${money(c.pend)}</button>`):`<small>All fees are paid. Thank you!</small>`}</div></div>
        <div class="sub"><div class="st">📍 Address</div>${ed?`<input id="ad_${s.id}" placeholder="Enter address" value="${esc(s.address)}"><button class="ghost" data-a="addr" data-id="${s.id}">Save address</button>`:`<p style="margin-bottom:8px">${esc(s.address)}</p><button class="ghost" data-a="eaddr" data-id="${s.id}">Change address</button>`}</div></div>`}).join(""):
        (!ld?"":A.length?`<div class="card pop"><h3>Application received</h3><p>Thank you! Your application for <b>${esc(A[0].name)}</b> (${esc(A[0].cls)}) has been sent. The teacher will call you on ${esc(A[0].phone)}.</p></div>`:`<div class="card pop"><h3>New student? Apply here</h3><p><small>This Gmail is not linked to a student yet. Fill in the form and the teacher will call you.</small></p><br><input id="an" placeholder="Student name"><input id="ac" list="cls" placeholder="Class"><datalist id="cls">${(F.list||[]).map(x=>`<option value="${esc(x.c)}">`).join("")}</datalist><input id="ap" type="tel" maxlength="10" placeholder="Mobile number (10 digits)"><button class="btn" data-a="apply">Submit application</button></div>`);
      const cl=S.map(s=>(s.cls||"").toLowerCase()),hw=H.filter(x=>(x.cls||"").toLowerCase()=="all"||cl.includes((x.cls||"").toLowerCase())).sort(byTs);
      if(hw.length)h+=`<div class="sec"><span>📚</span><h3>Homework</h3></div>`+hw.map(x=>`<div class="note pop"><small>Class: ${esc(x.cls)}</small><br>${esc(x.t)}</div>`).join("");
      if(N.length)h+=`<div class="sec"><span>📢</span><h3>Notices</h3></div>`+N.map(n=>`<div class="note pop">${esc(n.t)}</div>`).join("");
    }
    if(pg=="v"){const YV=[...V].filter(v=>v.vid).sort(byTs);
      h=`<h3 class="pop" style="font-size:22px">🎬 Videos</h3>`+(C.live?`<div class="sec"><span>🔴</span><h3>Live now</h3></div><div class="card pop"><iframe src="https://www.youtube-nocookie.com/embed/live_stream?channel=${esc(C.yt||YT)}&autoplay=1" allow="autoplay;encrypted-media;fullscreen" allowfullscreen></iframe></div>`:"")+`<div class="sec"><span>📺</span><h3>Latest from the channel</h3></div><div class="card pop"><iframe src="https://www.youtube-nocookie.com/embed/videoseries?list=UU${esc((C.yt||YT).slice(2))}" allowfullscreen></iframe></div>`+(YV.length?`<div class="sec"><span>🎞</span><h3>More videos</h3></div><small style="display:block;margin:-4px 0 10px">Tap a video to watch it full screen.</small><div class="vg">${YV.map(v=>`<div class="vt pop" data-a="play" data-id="${esc(v.vid)}"><div class="vid"><img src="https://img.youtube.com/vi/${esc(v.vid)}/mqdefault.jpg" alt="" loading="lazy"></div><p>${esc(v.t)}</p></div>`).join("")}</div>`:"");
    }
    if(pg=="i"){const L=F.list||[];h=`<h3 class="pop">Fee structure</h3><div class="card pop"><small>First-time registration fee</small><div class="pay">${F.reg!=null&&F.reg!==""?money(F.reg):"Not added yet"}</div></div>`+(L.length?`<div class="card pop"><h3>Fee by class</h3>${L.map(x=>`<div class="top" style="padding:8px 0;border-bottom:1px dashed var(--line)"><span>${esc(x.c)}</span><b>${money(x.f)}</b></div>`).join("")}</div>`:`<div class="empty">Class fees have not been added yet.</div>`)}
    if(pg=="s")h=`<h3 class="pop">Support</h3><div class="card pop"><p>Need help with fees, attendance or anything else? Contact your teacher.</p>${C.phone?`<a class="btn lnk" href="https://wa.me/${esc(C.phone)}" target="_blank">Chat on WhatsApp</a><a class="ghost lnk" href="tel:+${esc(C.phone)}">Call</a>`:`<br><small>Support details have not been added yet.</small>`}<a class="ghost lnk" href="${IG}" target="_blank">Instagram</a><a class="ghost lnk" href="${YTURL}" target="_blank">YouTube channel</a></div>`;
    if(pg=="g"){
      const cnt=id=>IT.filter(x=>x.aid==id).length,cov=id=>(IT.filter(x=>x.aid==id&&x.th).sort(byTs)[0]||{}).th;
      const card=(id,n,c)=>`<div class="alc pop ${c||""}" data-a="opa" data-id="${esc(id)}">${cov(id)?`<img src="${cov(id)}" alt="">`:`<div class="noc">🖼</div>`}<div class="alt"><b>${esc(n)}</b><small>${cnt(id)} items</small></div></div>`;
      if(openA){const its=aitems(),nm0=openA=="main"?"Coaching Album":(AL.find(x=>x.id==openA)||{}).name||"Album";
        h=`<button class="ghost" data-a="cla" style="margin-bottom:10px">← All albums</button><h3 class="pop">${esc(nm0)}</h3>`+(its.length?`<div class="agrid">${its.map((x,i)=>`<div class="gi pop" data-a="lb" data-i="${i}">${x.th?`<img src="${x.th}" alt="" loading="lazy">`:`<div class="noc">🎬</div>`}${x.k=="v"?`<span class="pl">▶</span>`:""}</div>`).join("")}</div>`:`<div class="empty">No photos or videos here yet.</div>`);
      }else{const al=[...AL].sort(byTs),pin=al.filter(x=>x.pinned).slice(0,4),rest=al.filter(x=>!pin.includes(x));
        h=`<h3 class="pop">Coaching Album</h3><div class="ag2">${card("main","Coaching Album","hero")}</div>`+(pin.length?`<h3>📌 Pinned albums</h3><div class="ag2">${pin.map(a=>card(a.id,a.name)).join("")}</div>`:"")+(rest.length?`<h3>More albums</h3><div class="ag2">${rest.map(a=>card(a.id,a.name)).join("")}</div>`:"");
      }
    }
    if(lb!=null){const LL=aitems(),it=LL[lb];if(it)h+=`<div class="lbx"><div class="lbb" data-a="lbx"></div><button class="lbcl" data-a="lbx" aria-label="Close">✕</button>${LL.length>1?`<button class="lbn l" data-a="lbp">‹</button><button class="lbn r" data-a="lbnx">›</button>`:""}<div class="lbc">${it.k=="v"?`<video controls autoplay playsinline src="${esc(it.url)}"></video>`:`<img src="${FULL[it.id]||it.th||""}" alt="" ${FULL[it.id]?"":'style="filter:blur(6px)"'}>`}</div><div class="lbi">${lb+1} / ${LL.length}</div></div>`}
    const s=S.find(x=>x.id==pay);
    if(s)h+=`<div class="modal"><div class="card"><h3>Pay ${money(cal(s).pend)}</h3>${C.qr?`<img src="${C.qr}" alt="Payment QR">`:`<p>The QR code is not available yet. Please contact your teacher.</p>`}<p><small>Scan with any UPI app and pay. After paying, choose:</small></p><div class="row"><button class="btn" data-a="done">Payment done</button><button class="ghost" data-a="notdone">Not done</button></div></div></div>`;
    if(play)h+=`<div class="modal"><div class="ppb" data-a="stop"></div><div class="card" style="max-width:640px;position:relative;z-index:1"><div class="top" style="margin-bottom:10px"><b style="text-align:left">${esc((V.find(v=>v.vid==play)||{}).t||"Video")}</b><button class="ghost" data-a="stop">✕ Close</button></div><iframe src="https://www.youtube-nocookie.com/embed/${esc(play)}?autoplay=1&rel=0" allow="autoplay;encrypted-media;fullscreen" allowfullscreen></iframe></div></div>`;
    let seen=ppSeen;try{if(PP.v&&sessionStorage.getItem("pp")==String(PP.v))seen=true}catch(e){}
    if(PP.on&&(PP.img||PP.t||PP.title)&&!seen)h+=popupHTML(PP);
    render(`<header><img class="lg" src="logo.png" alt=""><b>Topper's Hub</b><span class="tag">Parent</span><button class="ghost" data-a="out">Logout</button></header><main>${h}</main><div class="tb">${[["h","🏠","Home"],["v","🎬","Videos"],["g","🖼","Album"],["i","🏷","Fees"],["s","💬","Support"]].map(([k,i,l])=>`<button class="${pg==k?"on":""}" data-a="pg" data-k="${k}"><i style="display:block;font-style:normal;font-size:18px">${i}</i>${l}</button>`).join("")}</div>`);
  };
  const L=(c,f,w)=>unsubs.push(onSnapshot(w||collection(db,c),q=>{f(q.docs.map(d=>({id:d.id,...d.data()})));draw()}));
  unsubs.push(onSnapshot(query(collection(db,"students"),where("parentEmail","==",em)),q=>{S=q.docs.map(d=>({id:d.id,...d.data()}));ld=true;draw()},e=>toast("Could not load data: "+e.code)));
  L("payments",x=>P=x,query(collection(db,"payments"),where("parentEmail","==",em)));
  L("notices",x=>N=x,query(collection(db,"notices"),orderBy("ts","desc")));
  L("applications",x=>A=x,query(collection(db,"applications"),where("email","==",em)));L("videos",x=>V=x);L("homework",x=>H=x);
  unsubs.push(onSnapshot(doc(db,"config","fees"),d=>{F=d.data()||{};draw()}));
  unsubs.push(onSnapshot(doc(db,"config","pay"),d=>{C=d.data()||{};draw()}));
  unsubs.push(onSnapshot(doc(db,"config","popup"),d=>{PP=d.data()||{};draw()}));
  acts.ppx=()=>{ppSeen=true;try{sessionStorage.setItem("pp",String(PP.v||""))}catch(e){}draw()};
  L("albums",x=>AL=x);L("album_items",x=>IT=x);
  const need=()=>{const it=aitems()[lb];if(it&&it.k!="v"&&FULL[it.id]===undefined){FULL[it.id]="";getDoc(doc(db,"album_full",it.id)).then(x=>{FULL[it.id]=x.data()?.img||"";draw()}).catch(()=>{delete FULL[it.id]})}};
  acts.opa=d=>{openA=d.id;lb=null;scrollTo(0,0);draw()};
  acts.cla=()=>{openA=null;lb=null;draw()};
  acts.lb=d=>{lb=+d.i;need();draw()};
  acts.lbx=()=>{lb=null;draw()};
  acts.lbp=()=>{const n=aitems().length;if(!n)return;lb=(lb-1+n)%n;need();draw()};
  acts.lbnx=()=>{const n=aitems().length;if(!n)return;lb=(lb+1)%n;need();draw()};
  acts.swp=dx=>{if(lb==null)return;dx>0?acts.lbp():acts.lbnx()};
  acts.key=k=>{if(lb==null)return;if(k=="Escape")acts.lbx();else if(k=="ArrowLeft")acts.lbp();else if(k=="ArrowRight")acts.lbnx()};
  acts.pg=d=>{pg=d.k;if(d.k!="g"){openA=null;lb=null}draw()};
  acts.play=d=>{play=d.id;draw()};
  acts.stop=()=>{play=null;draw()};
  acts.apply=async()=>{const name=val("an"),cls=val("ac"),phone=val("ap").replace(/\D/g,"");if(!name||!cls||phone.length<10)return toast("Enter the student name, class and a 10-digit mobile number");try{await addDoc(collection(db,"applications"),{name,cls,phone,email:em,ts:serverTimestamp()});toast("Application submitted")}catch(e){toast("Could not submit")}};
  acts.eaddr=d=>{EA[d.id]=true;draw()};
  acts.addr=async d=>{const a=val("ad_"+d.id);if(!a)return toast("Enter the address first");try{await updateDoc(doc(db,"students",d.id),{address:a});delete EA[d.id];toast("Address saved");draw()}catch(e){toast("Could not save address")}};
  acts.pay=d=>{pay=d.id;draw()};
  acts.notdone=()=>{pay=null;draw()};
  acts.done=async()=>{const s=S.find(x=>x.id==pay);if(!s)return;
    try{await addDoc(collection(db,"payments"),{sid:s.id,name:s.name,amt:cal(s).pend,parentEmail:em,status:"pending",ts:serverTimestamp()});toast("Sent to your teacher for confirmation")}catch(e){toast("Could not send payment")}
    pay=null;draw()};
}
